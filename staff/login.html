<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login | Lavender House Cleaning</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="stylesheet" href="../style.css">
<script>document.documentElement.className+=" js";</script>
</head>
<body>
<main id="main">
<section style="padding:96px 0;">
  <div class="wrap center" style="max-width:420px;">
    <span class="eyebrow">Staff &amp; Admin</span>
    <h1>Log In</h1>

    <form class="form-card" id="loginForm" style="text-align:left;margin-top:24px;">
      <p class="note" id="formError" style="display:none;color:#b3261e;"></p>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <div class="center" style="margin-top:24px;">
        <button class="btn btn-primary btn-lg" type="submit">Log In</button>
      </div>
    </form>
  </div>
</section>
</main>

<script src="../assets/api.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var f = e.target, errEl = document.getElementById('formError');
  errEl.style.display = 'none';
  apiFetch('/api/auth/login', {
    method: 'POST',
    body: JSON.stringify({ email: f.email.value, password: f.password.value })
  }).then(function (user) {
    if (user.role !== 'STAFF' && user.role !== 'ADMIN') {
      throw new Error('This login is for staff and admin accounts only.');
    }
    window.location.href = 'dashboard.html';
  }).catch(function (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
  });
});
</script>
</body>
</html>
