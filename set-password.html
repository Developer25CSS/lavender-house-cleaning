<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set Your Password | Lavender House Cleaning</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="stylesheet" href="style.css">
<script>document.documentElement.className+=" js";</script>
</head>
<body>
<main id="main">
<section style="padding:96px 0;">
  <div class="wrap center" style="max-width:420px;">
    <span class="eyebrow">Welcome to the Team</span>
    <h1>Set Your Password</h1>
    <p class="lede">Choose a password to finish setting up your cleaner account.</p>

    <form class="form-card" id="setPwForm" style="text-align:left;margin-top:24px;">
      <p class="note" id="formError" style="display:none;color:#b3261e;"></p>
      <div class="field">
        <label for="password">New Password</label>
        <input type="password" id="password" name="password" required minlength="8">
      </div>
      <div class="center" style="margin-top:24px;">
        <button class="btn btn-primary btn-lg" type="submit">Set Password &amp; Log In</button>
      </div>
    </form>
  </div>
</section>
</main>

<script src="assets/api.js"></script>
<script>
document.getElementById('setPwForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var f = e.target, errEl = document.getElementById('formError');
  errEl.style.display = 'none';

  var token = new URLSearchParams(window.location.search).get('token');
  if (!token) {
    errEl.textContent = 'This link is missing its setup token. Ask the office to resend it.';
    errEl.style.display = 'block';
    return;
  }

  apiFetch('/api/auth/set-password', {
    method: 'POST',
    body: JSON.stringify({ token: token, password: f.password.value })
  }).then(function (user) {
    window.location.href = (user.role === 'STAFF' || user.role === 'ADMIN') ? 'staff/dashboard.html' : 'account.html';
  }).catch(function (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
  });
});
</script>
</body>
</html>
